<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Register The Product</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>


	<form th:action="@{/register}" th:object="${product}" method="post">


		<div class="row">
			<div class="col-md-3">
			</div>
			<div class="col-md-5">
				<h1 style="color: red;">Register The Product</h1>
				<hr>
				<!--name-->
				<div class="mb-3 mt-4">
					<label>Name:</label>
					<input type="text" th:field="*{name}" class="form-control" required>
				</div>

				<!--brand-->
				<div class="mb-3 mt-4">
					<label>Brand:</label>
					<input type="text" th:field="*{brand}" class="form-control" required>
				</div>

				<!--warantty-->
				<div class="mb-3 mt-4">
					<label>Warantty:</label>
					<input type="number" th:field="*{warantty}" class="form-control" required>
				</div>
				<!--prize-->
				<div class="mb-3 mt-4">
					<label>Prize:</label>
					<input type="number" th:field="*{prize}" class="form-control" required>
				</div>

				<!--quantity-->
				<div class="mb-3 mt-4">
					<label>Quantity:</label>
					<input type="number" th:field="*{quantity}" class="form-control" required>
				</div>

				<!--date-->
				<div class="mb-3 mt-4">
					<label>MFD:</label>
					<input type="date" th:field="*{mfd}" class="form-control" required>
				</div>
				<!--type-->
				<div class="mb-3 mt-4">
					<label>Type:</label>
					<select th:field="*{type}"class="form-control">
						<option value="">--select--</option>
						<option th:each="t : ${type}" th:value="${t}" th:text="${t}"></option>
					</select>
				</div><br>
				<div class="mb-3 mt-4 ml-5">
				<button type="submit" class="btn btn-success ">Save</button>
				<a href="/" class="btn btn-danger">Cancel</a>
				</div>
			</div>
		</div>





	</form>





</body>

</html>
