<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<title>Tweet-X - Motivational Videos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

	<style>
		.video-thumbnail {
			position: relative;
			cursor: pointer;
		}
		.zoom:hover {
		      transform: scale(1.1); /* Zoom in 20% */
		      z-index: 10;
		    }
			
		.video-thumbnail img {
			width: 100%;
			height: auto;
			display: block;
		}

		.video-thumbnail::after {
			content: '▶';
			      position: absolute;
			      color: red;
			      font-size: 50px;
			      top: 50%;
			      left: 50%;
			      transform: translate(-50%, -50%);
			      opacity: 0.8;
			      pointer-events: none;
			      transition: opacity 0.2s;
				  
		}
		.video-thumbnail:hover::after {
		     opacity: 0; /* Hide symbol on hover if you want */
		   }
	</style>
</head>

<body>
	<!-- Header -->
	<header class="text-light border-bottom py-2 mb-4" style="background-color:black;">
		  <div class="container-fluid d-flex justify-content-between align-items-center">
		    <a class="navbar-brand text-white" href="#"> 
				<img src="/images/x.png" style="height: 50px;">Tweet-X</a>
		    <ul class="nav">
		      <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
		      <li class="nav-item"><a class="nav-link text-white" th:href="@{/about}">About</a></li>
		      
		      <li class="nav-item"><a class="nav-link text-white" href="#">Team</a></li>
		 <li class="nav-item"><a class="nav-link text-white" th:href="@{/logout}"><i class="fa fa-user"></i> Logout</a></li>
		    </ul>
		  </div>
		</header>
	<div class="container mt-5">
		<h2 class="mb-4 text-center">Motivational Videos</h2>
		<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
			<div class="col zoom" th:each="videoId : ${video}">
				<div class="card h-100 shadow-sm">
					<div class="video-thumbnail" th:attr="data-id=${videoId}" onclick="loadVideo(this)">
						<img th:src="'https://img.youtube.com/vi/' + ${videoId} + '/hqdefault.jpg'" alt="Video Thumbnail" 
						
						 type="video/mp4" loop class="hover-to-play w-100"/>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		function loadVideo(element) {
			const videoId = element.getAttribute("data-id");
			const iframe = document.createElement("iframe");
			iframe.setAttribute("src", "https://www.youtube.com/embed/" + videoId + "?autoplay=1");
			iframe.setAttribute("frameborder", "0");
			iframe.setAttribute("allowfullscreen", "true");
			iframe.setAttribute("allow", "autoplay");
			iframe.style.width = "100%";
			iframe.style.height = "100%";
			element.parentNode.replaceChild(iframe, element);
		}
	</script>
</body>

</html>
